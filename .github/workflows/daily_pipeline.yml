name: MarketPulse Daily Pipeline

on:
  schedule:
    - cron: "0 14 * * *"  # 9 AM ET
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up database
        run: python setup_db.py

      - name: Ingest YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python ingest_youtube.py
        continue-on-error: true  # don't stop if quota exceeded

      - name: Generate daily intelligence report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python analyze_daily.py

      - name: Extract entities & sentiment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python analyze_companies.py

      - name: Fetch stock prices
        run: python fetch_stock_prices.py

      - name: Save daily snapshots
        run: python snapshot_daily.py

      - name: Aggregate ticker frequency
        run: python aggregate_tickers.py


      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          retention-days: 30
